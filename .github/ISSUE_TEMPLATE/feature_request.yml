name: "💡 Feature Request"
description: "Suggest a new feature or improvement"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea? We'd love to hear it!
        Есть идея? Мы будем рады её услышать!
  - type: dropdown
    id: addon
    attributes:
      label: Addon
      description: Which addon is this for?
      options:
        - "metadata.kinoscope.python (Movie Scraper)"
        - "metadata.tvshows.kinoscope.python (TV Show Scraper)"
        - "Both"
        - "Not sure"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Feature description
      description: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: Why is this useful? How would you use it?
    validations:
      required: true
